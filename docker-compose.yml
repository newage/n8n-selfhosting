services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Warsaw
      - TZ=Europe/Warsaw
      - N8N_ENCRYPTION_KEY=local-dev-key-change-me
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: